name: Build & Release IpScanConnect

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Build Application (WPF x64)
      run: |
        msbuild App\IpScanConnect.csproj /p:Configuration=Release /p:Platform=x64 /v:minimal

    - name: Copy Main Executable for Installer Embedding
      shell: pwsh
      run: |
        Copy-Item "bin\IpScanConnect.exe" "IpScanConnect.exe" -Force

    - name: Build Uninstaller
      run: |
        csc /nologo /target:winexe /r:System.Windows.Forms.dll /r:System.Drawing.dll /out:Installer\Uninstall.exe Installer\UninstallProgram.cs

    - name: Build Graphical Installer (Setup)
      run: |
        msbuild Installer\IpScanConnect_Setup.csproj /p:Configuration=Release /p:Platform=x64 /v:minimal

    - name: Prepare Release Packages
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Path "Release" -Force | Out-Null
        Copy-Item "bin\IpScanConnect_Setup.exe" "Release\IpScanConnect_Setup_v1.0.exe" -Force

        # Package Portable ZIP
        New-Item -ItemType Directory -Path "dist_temp\IpScanConnect_v1.0_Portable" -Force | Out-Null
        Copy-Item "IpScanConnect.exe" "dist_temp\IpScanConnect_v1.0_Portable\" -Force
        Copy-Item "Lancer_IpScanConnect.bat" "dist_temp\IpScanConnect_v1.0_Portable\" -Force
        Copy-Item "README.md" "dist_temp\IpScanConnect_v1.0_Portable\" -Force
        Copy-Item "LICENSE" "dist_temp\IpScanConnect_v1.0_Portable\" -Force
        Compress-Archive -Path "dist_temp\IpScanConnect_v1.0_Portable\*" -DestinationPath "Release\IpScanConnect-v1.0-Portable.zip" -Force
        Remove-Item -Recurse -Force "dist_temp"

    - name: Upload Installer Artifact
      uses: actions/upload-artifact@v4
      with:
        name: IpScanConnect-Setup
        path: Release/IpScanConnect_Setup_v1.0.exe

    - name: Upload Portable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: IpScanConnect-Portable
        path: Release/IpScanConnect-v1.0-Portable.zip

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0' }}
        name: "IpScanConnect ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0' }}"
        files: |
          Release/IpScanConnect_Setup_v1.0.exe
          Release/IpScanConnect-v1.0-Portable.zip
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
