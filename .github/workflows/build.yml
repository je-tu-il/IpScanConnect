name: Build & Release IpScanConnect

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Build Application (WPF x64)
      run: |
        msbuild App\IpScanConnect.csproj /p:Configuration=Release /p:Platform=x64 /v:minimal

    - name: Prepare Artifact Package
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Path "dist\IpScanConnect" -Force | Out-Null
        Copy-Item "bin\IpScanConnect.exe" "dist\IpScanConnect\" -Force
        Copy-Item "Lancer_IpScanConnect.bat" "dist\IpScanConnect\" -Force
        Copy-Item "README.md" "dist\IpScanConnect\" -Force
        Copy-Item "LICENSE" "dist\IpScanConnect\" -Force
        Compress-Archive -Path "dist\IpScanConnect\*" -DestinationPath "IpScanConnect-Windows-x64.zip" -Force

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: IpScanConnect-Windows-x64
        path: IpScanConnect-Windows-x64.zip

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: IpScanConnect-Windows-x64.zip
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
